name: Build FX Keyboard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: fx-keyboard-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Create or Update GitHub Release with APK
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "FX Keyboard with Violin & Piano (Latest APK)"
        body: |
          🎵 **FX Sound Keyboard with Piano, Violin & Gboard Key Magnifier**
          - Separate individual melodic notes for all English characters A-Z
          - Violin Ensemble and Grand Piano sound packs
          - Continuous note sustain until the next key is pressed
          - Google Keyboard-style elevated key preview popup
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

